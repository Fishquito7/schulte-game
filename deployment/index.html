<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>舒尔特方格 · 形状挑战</title>
<style>
  :root{
    --bg:#070a12; --panel:#0f1421; --line:#222c44; --txt:#e8eefc; --dim:#7f8bab;
    --acc:#4cc9f0; --acc2:#7cf5c4; --bad:#ff5d7a; --gold:#ffd166;
    --cell:#141c2e; --cellHover:#1c2740; --stroke:#26314d; --strokeHover:#3a4a72;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;padding:16px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1100px 700px at 50% -15%, #16203a 0%, #070a12 58%) fixed;
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{width:min(96vw,640px);display:flex;flex-direction:column;gap:11px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand h1{margin:0;font-size:15px;letter-spacing:.18em;font-weight:700}
  .brand span{font-size:11px;color:var(--dim);letter-spacing:.08em}
  .iconbtn{
    border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:10px;
    width:34px;height:32px;font-size:14px;cursor:pointer;transition:.15s;line-height:1;
  }
  .iconbtn:hover{color:var(--txt);border-color:var(--strokeHover)}

  .hud{display:grid;grid-template-columns:1.15fr .8fr 1fr .85fr;gap:7px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:7px 10px;display:flex;align-items:baseline;gap:5px;overflow:hidden}
  .stat b{font-size:clamp(16px,4.4vw,22px);font-variant-numeric:tabular-nums;font-weight:750;letter-spacing:-.02em;line-height:1.35}
  .stat small{font-size:10.5px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
  #target{color:var(--acc2)}
  #errors{color:var(--bad)}
  #score{transition:color .2s}
  .g-S{color:var(--gold)!important}
  .g-A{color:var(--acc2)!important}
  .g-B{color:var(--acc)!important}
  .g-C{color:#9aa8c7!important}
  .g-D{color:var(--bad)!important}

  .boardWrap{position:relative;width:min(100%,56vh);margin:0 auto;aspect-ratio:1/1}
  svg{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}

  .cell > *{fill:var(--cell);stroke:var(--stroke);stroke-width:1.5;transition:fill .18s,stroke .18s}
  .cell{cursor:pointer}
  .cell:hover > *{fill:var(--cellHover);stroke:var(--strokeHover)}
  .cell text{fill:#dfe8fb;font-weight:650;pointer-events:none;font-family:inherit;font-variant-numeric:tabular-nums}
  .cell.done{opacity:.26;pointer-events:none;transition:opacity .3s}
  #board.fin .cell.done{opacity:.5}
  #board.fin .cell.done > *{stroke:#2f3f63}
  .cell.done > *{fill:#0a1220;stroke:#182135}
  .cell.wrong > *{fill:#3a1220;stroke:var(--bad)}
  .cell.wrong{animation:shake .24s ease-in-out;transform-box:fill-box;transform-origin:center}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .orbit{fill:none;stroke:rgba(124,245,196,.32);stroke-width:1.5;stroke-dasharray:2 15;
         transform-box:view-box;transform-origin:300px 300px;animation:spin 18s linear infinite;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .halo{fill:none;stroke:rgba(76,201,240,.5);stroke-width:1.5;pointer-events:none;animation:breathe 4.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.18}50%{opacity:.75}}

  .rip{fill:none;stroke:var(--acc2);stroke-width:2;transform-box:view-box;animation:rip .55s ease-out forwards;pointer-events:none}
  @keyframes rip{from{opacity:.9;transform:scale(.25)}to{opacity:0;transform:scale(2.2)}}

  .prog{height:3px;border-radius:3px;background:#141c2e;overflow:hidden}
  .prog i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .25s ease}

  .controls{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
  .seg{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:14px;border:1px solid var(--line)}
  .seg button{
    flex:1;border:0;background:transparent;color:var(--dim);font:inherit;font-size:12.5px;
    padding:7px 4px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:linear-gradient(180deg,#22304f,#1a2540);color:#fff;box-shadow:0 2px 10px rgba(76,201,240,.18)}
  .subrow{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim)}
  .toggle{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:10px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;transition:.15s}
  .toggle.on{color:#0b1220;background:var(--acc2);border-color:var(--acc2);font-weight:700}

  #overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    border-radius:26px;background:rgba(7,10,18,.86);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;
  }
  #overlay.show{opacity:1;pointer-events:auto}
  #overlay[hidden]{display:none}

  .cd{font-size:clamp(60px,13vmin,110px);font-weight:820;letter-spacing:-.04em;
      background:linear-gradient(180deg,#fff,#78c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;
      animation:pop .32s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}

  .panel-in{text-align:center;padding:20px 24px;min-width:min(86%,330px);
    background:#0f1421;border:1px solid var(--line);border-radius:22px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .28s ease}
  .panel-in h2{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.2em}
  .big{font-size:clamp(34px,7.6vmin,54px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
  .big small{font-size:.34em;color:var(--dim);margin-left:3px;font-weight:600;letter-spacing:0}
  .big em{font-size:.26em;color:var(--dim);font-style:normal;margin-left:8px;font-weight:600;letter-spacing:.06em}
  .meta{margin-top:9px;font-size:12.5px;color:var(--dim);line-height:1.85;font-variant-numeric:tabular-nums}
  .meta b{color:var(--txt);font-weight:650}
  .rec{color:var(--acc2);font-weight:700;letter-spacing:.05em}
  .tiny{font-size:11px;color:#5d6a88;margin-top:7px;font-variant-numeric:tabular-nums}

  .scoreRow{display:flex;align-items:center;justify-content:center;gap:14px}
  .badge{
    width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:27px;font-weight:850;letter-spacing:-.02em;flex:0 0 auto;
    border:2px solid currentColor;background:rgba(255,255,255,.03);
    box-shadow:0 0 26px -6px currentColor;
  }
  .btn{
    margin-top:14px;border:0;border-radius:12px;padding:11px 26px;font:inherit;font-size:14px;font-weight:700;
    color:#06121c;background:linear-gradient(135deg,var(--acc2),var(--acc));cursor:pointer;letter-spacing:.06em;
    box-shadow:0 8px 26px rgba(76,201,240,.32);transition:transform .12s,box-shadow .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn:hover{box-shadow:0 10px 32px rgba(76,201,240,.48)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);box-shadow:none}
  .btn.ghost:hover{color:var(--txt);border-color:var(--strokeHover);box-shadow:none}
  .hint{margin-top:8px;font-size:11.5px;color:#5d6a88}

  /* ---------- 排行榜 ---------- */
  .lbmodal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;
    background:rgba(4,7,13,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none}
  .lbmodal.show{opacity:1;pointer-events:auto}
  .lb-card{width:min(94vw,440px);max-height:86vh;display:flex;flex-direction:column;gap:11px;
    background:linear-gradient(180deg,#111827,#0d1320);border:1px solid var(--line);border-radius:20px;padding:16px;
    box-shadow:0 30px 80px rgba(0,0,0,.6)}

  .lb-head{display:flex;align-items:center;justify-content:space-between}
  .lb-head h2{margin:0;font-size:13px;letter-spacing:.22em;color:var(--dim);font-weight:600}
  .lb-tabs{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
  .lb-sub{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim)}
  .lb-list{overflow:auto;flex:1;min-height:96px;max-height:46vh;display:flex;flex-direction:column;gap:6px;padding-right:2px}
  .lb-row{display:grid;grid-template-columns:30px 1fr 58px 76px;align-items:center;gap:8px;
    padding:9px 11px;border-radius:12px;background:#0f1421;border:1px solid #1b2337;font-variant-numeric:tabular-nums}
  .lb-row.me{border-color:var(--acc2);background:#10231f}
  .rk{font-weight:800;font-size:13px;color:var(--dim);text-align:center}
  .rk.rk1{color:#ffd166}.rk.rk2{color:#cfd8e8}.rk.rk3{color:#d08b5b}
  .lb-row .t{font-size:17px;font-weight:750}
  .lb-row .t small{font-size:11px;color:var(--dim);margin-left:2px;font-weight:500}
  .lb-row .s{text-align:right;font-weight:750;font-size:14px}
  .lb-row .d{text-align:right;font-size:11px;color:#5d6a88}
  .lb-empty{padding:34px 10px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.9}
  .lb-foot{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#5d6a88;gap:8px}

  .chip{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:10px;
    padding:6px 11px;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;max-width:118px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.15s}
  .chip:hover{border-color:var(--strokeHover)}
  .chip em{color:#5d6a88;font-style:normal;font-weight:500;margin-left:3px;font-size:11px}

  .gate-card{padding:26px 24px;text-align:center}
  .gate-logo{font-size:16px;letter-spacing:.2em;font-weight:750;margin-bottom:6px}
  .gate-sub{font-size:12.5px;color:var(--dim);margin:0 0 18px}
  #gate .gate-input{display:block;width:100%;max-width:none;flex:none;
    margin:0 0 10px;padding:12px;font-size:15px}
  .gate-btn{width:100%;margin-top:2px}
  .gate-msg{min-height:16px;font-size:11.5px;color:var(--bad);margin-top:8px}
  .linkbtn{background:none;border:0;color:var(--dim);font:inherit;font-size:11.5px;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;margin-top:6px;padding:4px}
  .linkbtn:hover{color:var(--txt)}

  .me-top{display:flex;align-items:baseline;gap:6px;justify-content:center;margin:4px 0 12px}
  .me-name{font-size:20px;font-weight:750}
  .me-tag{color:#5d6a88;font-size:12px}
  .me-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:8px}
  .me-lbl{font-size:11.5px;color:var(--dim)}
  .me-row code{font-size:16px;letter-spacing:.14em;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--acc2)}
  .me-note{font-size:11.5px;color:#5d6a88;line-height:1.7;margin:6px 0 6px;text-align:left}
  .me-warn{font-size:11.5px;color:var(--gold);background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.22);
    border-radius:8px;padding:7px 9px;margin:10px 0 6px;text-align:center}
  .me-help{font-size:11px;color:#5d6a88;text-align:center;margin:0 0 8px}
  .copy-mail{background:none;border:0;padding:0;font:inherit;color:var(--acc);cursor:pointer;
    text-underline-offset:3px}
  .copy-mail:hover{text-decoration:underline}
  .copy-mail.copied{color:var(--acc2);text-decoration:none}
  .me-link{font-size:11px;color:var(--dim);word-break:break-all;background:#0b1120;border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font-family:ui-monospace,Menlo,Consolas,monospace;text-align:left}
  .me-actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .me-rename{display:flex;gap:7px;margin-top:10px}
  .me-rename .nameInput{max-width:none}
  .lb-row .nm em{color:#5d6a88;font-style:normal;font-weight:500;font-size:11px;margin-left:3px}
  .lb-scope{margin-bottom:1px}
  .lb-row.g{grid-template-columns:26px 1fr 62px 44px}
  .lb-row.g .nm{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .signrow{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .nameInput{flex:1;max-width:190px;background:#0b1120;border:1px solid var(--line);border-radius:10px;
    color:var(--txt);font:inherit;font-size:13px;padding:9px 11px;outline:none;text-align:center}
  .nameInput:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(76,201,240,.15)}
  .nameInput::placeholder{color:#4c5875}
  .btn.mini{margin-top:0;padding:9px 16px;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><h1>舒尔特方格</h1><span>SHAPES</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="chip" id="chip" hidden></button>
      <button class="iconbtn" id="openLB" title="排行榜">🏆</button>
      <button class="iconbtn" id="sound" title="音效开关">🔊</button>
    </div>
  </div>

  <div class="hud">
    <div class="stat"><b id="time">0.00</b><small>秒</small></div>
    <div class="stat"><b id="score">—</b><small>评分</small></div>
    <div class="stat"><b id="target">1</b><small>下一个</small></div>
    <div class="stat"><b id="errors">0</b><small>失误</small></div>
  </div>

  <div class="prog"><i id="bar"></i></div>

  <div class="boardWrap">
    <svg id="board" viewBox="0 0 600 600" aria-label="舒尔特方格棋盘"></svg>
    <div id="overlay"></div>
  </div>

  <div class="controls">
    <div class="seg" id="shapeSeg">
      <button data-v="square" class="on">方形</button>
      <button data-v="radial">圆环</button>
      <button data-v="star">星芒</button>
    </div>
    <div class="seg" id="sizeSeg">
      <button data-v="4">4×4</button>
      <button data-v="5" class="on">5×5</button>
      <button data-v="6">6×6</button>
    </div>
  </div>
  <div class="subrow">
    <span id="bestLine">最佳 —</span>
    <div style="display:flex;gap:8px">
      <button class="toggle on" id="motion">动效</button>
      <button class="toggle" id="rev">倒序</button>
      <button class="toggle" id="again2">重开</button>
    </div>
  </div>
</div>

<div class="lbmodal" id="me">
  <div class="lb-card">
    <div class="lb-head"><h2>我的档案</h2><button class="iconbtn" id="meClose">✕</button></div>
    <div class="me-top"><span class="me-name" id="meName">—</span><span class="me-tag" id="meTag"></span></div>
    <div class="me-row"><span class="me-lbl">档案号</span><code id="meId">—</code><button class="toggle" id="meCopyId">复制</button></div>
    <div class="me-warn" id="meWarn">档案号是唯一登录凭据，请妥善保存</div>
    <div class="me-help" id="meHelp">若想找回，请联系管理员 <button type="button" class="copy-mail" id="meMail">fishquito7@163.com</button></div>
    <div class="me-note" id="meNote">换设备时把下面的链接发到手机，或直接打开，就能接管这份档案。</div>
    <div class="me-link" id="meLink">—</div>
    <div class="me-actions">
      <button class="toggle" id="meCopyLink">复制同步链接</button>
      <button class="toggle" id="meRename">改昵称</button>
      <button class="toggle" id="meOut">退出</button>
    </div>
    <div class="me-rename" id="meRenameBox" hidden>
      <input id="meRenameInput" class="nameInput" maxlength="12" spellcheck="false" placeholder="新昵称">
      <button class="toggle on" id="meRenameOk">保存</button>
    </div>
  </div>
</div>

<div class="lbmodal" id="gate">
  <div class="lb-card gate-card">
    <div class="gate-logo">舒尔特方格</div>
    <p class="gate-sub" id="gateSub">起个名字就能上榜，不用注册</p>
    <input id="gateName" class="nameInput gate-input" maxlength="12" placeholder="你的昵称" spellcheck="false">
    <input id="gateId" class="nameInput gate-input" maxlength="9" placeholder="9 位档案号" spellcheck="false" hidden>
    <button class="btn gate-btn" id="gateGo">开始</button>
    <div class="gate-msg" id="gateMsg"></div>
    <button class="linkbtn" id="gateSwitch">已有档案？用档案号登录</button>
  </div>
</div>

<div class="lbmodal" id="lb">
  <div class="lb-card">
    <div class="lb-head">
      <h2>排行榜</h2>
      <button class="iconbtn" id="lbClose" title="关闭">✕</button>
    </div>
    <div class="lb-tabs">
      <div class="seg" id="lbShapeSeg">
        <button data-v="square">方形</button>
        <button data-v="radial">圆环</button>
        <button data-v="star">星芒</button>
      </div>
      <div class="seg" id="lbSizeSeg">
        <button data-v="4">4×4</button>
        <button data-v="5">5×5</button>
        <button data-v="6">6×6</button>
      </div>
    </div>
    <div class="lb-sub">
      <span id="lbSubtitle">—</span>
      <button class="toggle" id="lbRev">倒序</button>
    </div>
    <div class="seg lb-scope" id="lbScope" hidden>
      <button data-v="local" class="on">我的记录</button>
      <button data-v="global">全球</button>
    </div>
    <div class="lb-list" id="lbList"></div>
    <div class="lb-foot">
      <span id="lbFootNote">我的记录 · 最近 20 次</span>
      <button class="toggle" id="lbClear">清空本项</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const $ = s => document.querySelector(s);
  const board   = $('#board');
  const overlay = $('#overlay');
  const elTime  = $('#time');
  const elScore = $('#score');
  const elTarget= $('#target');
  const elErr   = $('#errors');
  const elBar   = $('#bar');
  const elBest  = $('#bestLine');

  // 每形状每尺寸的环带格数（总和 = n²）
  const RING_PRESETS = { 4:[1,5,10], 5:[1,8,16], 6:[1,8,12,15] };

  // S 级基准线（秒）：圆环最难、蜂窝次之
  // S 级基准线（秒）：5×5 方形要 15 秒以内才算 S，其余按格子数与形状难度换算
  //   每格约 0.6s；4×4 略快、6×6 略慢；星芒 ×1.2、圆环（自转）×1.27
  const PAR = {
    square:{4: 9, 5:15, 6:23},
    star:  {4:11, 5:18, 6:27},
    radial:{4:12, 5:19, 6:29}
  };
  const SCORE_MAX = 150;        // 上限定在 150，头部玩家之间还有区分度
  // 评级线整体下压：S 必须打满基准线，A/B/C 才不至于人人 D
  const GRADE_CUT = [['S',100],['A',80],['B',65],['C',50],['D',0]];

  // 圆环各环角速度（deg/s），正负代表方向
  const ROT_SPEED = [0, 6, -4.2, 3.1, -2.3, 1.7];

  /* ---------------- 在线榜配置 ----------------
     base 填你自己的 Node 后端地址，例如 https://api.example.com；
     留空时自动探测「同源 /api/health」——用 server.js 直接托管本页时免配置。
     也可以在页面里先设置 window.SCHULTE_NET = { base: '...' } 覆盖。 */
  const NET = Object.assign({
    base: ''
  }, window.SCHULTE_NET || {});

  let online = !!NET.base;

  const netReady = (async function probeBackend(){
    if(online || location.protocol === 'file:') return online;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 1500);
    try{
      const r = await fetch(location.origin + '/api/health', { signal: ctrl.signal });
      if(r.ok){ const j = await r.json(); if(j && j.ok) online = true; }
    }catch(e){}
    finally{ clearTimeout(timer); }
    return online;
  })();

  const state = {
    shape:'square', n:5, reverse:false, motion:true,
    total:25, queue:[], qi:0, errors:0, penalty:0,
    started:false, finished:false, t0:0, raf:0, token:0, sound:true,
    lastRun:null
  };

  /* ---------------- 档案：昵称 + 9 位档案号 ----------------
     档案号是唯一的「钥匙」，昵称只是显示名（允许重名）。
     存在 localStorage 的 schulte.profile 里，换设备靠 ?id= 链接接管。 */
  const PROF_KEY = 'schulte.profile';
  let profile = null;
  try{
    const raw = JSON.parse(localStorage.getItem(PROF_KEY) || 'null');
    if(raw && typeof raw.id === 'string' && /^[0-9]{3}[A-Z0-9]{6}$/.test(raw.id)) profile = raw;
  }catch(e){}

  function saveProfile(p2){
    profile = p2;
    try{ localStorage.setItem(PROF_KEY, JSON.stringify(p2)); }catch(e){}
    renderChip();
  }
  function clearProfile(){
    profile = null;
    try{ localStorage.removeItem(PROF_KEY); }catch(e){}
    renderChip();
  }
  function renderChip(){
    const chip = $('#chip');
    if(!chip) return;
    if(!profile){ chip.hidden = true; return; }
    chip.hidden = false;
    chip.innerHTML = esc(profile.name) + (profile.id ? `<em>#${profile.id.slice(0,3)}</em>` : '');
  }
  const tagOf = id => '#' + String(id || '').slice(0, 3);

  // 同步链接要用「线上站点」而不是本机回环地址
  const PUBLIC_BASE = 'https://fishquito.site';
  function siteBase(){
    const h = location.hostname;
    if(location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h === '::1')
      return PUBLIC_BASE;
    return location.origin;
  }
  const syncLink = id => siteBase() + location.pathname.replace(/\/[^/]*$/, '/') + '?id=' + encodeURIComponent(id);

  // 复制到剪贴板：https/localhost 用 Clipboard API，http 环境退回 execCommand
  async function copyText(text){
    if(navigator.clipboard && window.isSecureContext){
      try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove();
    return ok;
  }

  let animT = 0, animRAF = 0, rings = [];

  /* ---------------- 音效 ---------------- */
  let actx = null;
  function blip(freq, dur, type){
    if(!state.sound) return;
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = 0.045;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.06));
      o.start(t); o.stop(t + (dur || 0.06) + 0.02);
    }catch(e){}
  }
  function fanfare(grade){
    const seq = grade === 'S' ? [784,988,1175,1568]
              : grade === 'A' ? [784,988,1175]
              : grade === 'B' ? [659,880]
              : grade === 'C' ? [523,659]
              : [196,165];
    seq.forEach((f, i) => setTimeout(()=>blip(f, .13, 'sine'), i*95));
  }

  /* ---------------- 评分 ---------------- */
  const parOf   = () => PAR[state.shape][state.n];
  const scoreOf = t => Math.max(0, Math.min(SCORE_MAX, Math.round(parOf() / t * 100)));
  function gradeOf(s){
    for(const g of GRADE_CUT) if(s >= g[1]) return g[0];
    return 'D';
  }
  function gradeLines(){
    const p = parOf();
    return GRADE_CUT.filter(g => g[1] > 0 && g[0] !== 'S').map(g => `${g[0]}≤${(100*p/g[1]).toFixed(1)}s`).join(' · ');
  }

  /* ---------------- 布局：方形 ---------------- */
  function buildSquare(n){
    const pad = 26, gap = n <= 4 ? 12 : (n === 5 ? 10 : 8);
    const s = (600 - pad*2 - gap*(n-1)) / n;
    const rx = Math.min(16, s*0.18);
    const out = [];
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      const x = pad + c*(s+gap), y = pad + r*(s+gap);
      out.push({
        markup:`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${s.toFixed(2)}" height="${s.toFixed(2)}" rx="${rx.toFixed(2)}" ry="${rx.toFixed(2)}"/>`,
        cx:x+s/2, cy:y+s/2, fs:s*0.42
      });
    }
    return out;
  }

  /* ---------------- 布局：圆环（等面积分格） ---------------- */
  const CX = 300, CY = 300, RAD = 274;
  const pt = (r,a) => [CX + r*Math.cos(a), CY + r*Math.sin(a)];

  function sectorPath(r0, r1, a0, a1){
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const [x1,y1] = pt(r1,a0), [x2,y2] = pt(r1,a1);
    if(r0 <= 0.5){
      return `M${CX} ${CY}L${x1.toFixed(2)} ${y1.toFixed(2)}A${r1.toFixed(2)} ${r1.toFixed(2)} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z`;
    }
    const [x3,y3] = pt(r0,a1), [x4,y4] = pt(r0,a0);
    return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r1.toFixed(2)} ${r1.toFixed(2)} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`
         + `L${x3.toFixed(2)} ${y3.toFixed(2)}A${r0.toFixed(2)} ${r0.toFixed(2)} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)}Z`;
  }

  function buildRadial(n){
    const counts = RING_PRESETS[n] || RING_PRESETS[5];
    const N = counts.reduce((a,b)=>a+b, 0);
    const out = [];
    let cum = 0, rPrev = 0;

    counts.forEach((count, ri) => {
      cum += count;
      // 半径按累计格数开方 → 每个扇环面积相等 → 每格面积相等
      const rOuter = RAD * Math.sqrt(cum / N);
      const rInner = rPrev + (ri === 0 ? 0 : 3);
      const rOut   = rOuter - 3;
      rPrev = rOuter;

      if(count === 1){
        out.push({ markup:`<circle cx="${CX}" cy="${CY}" r="${rOut.toFixed(2)}"/>`, ring:ri, cx:CX, cy:CY, fs:rOut*0.6 });
        return;
      }

      const span = Math.PI*2 / count;
      const gapA = Math.min(0.055, span*0.1);
      const midR = (rInner + rOut)/2;
      const fs   = Math.max(11, Math.min(46, Math.min(rOut - rInner, span*midR) * 0.44));

      for(let j=0;j<count;j++){
        const a0 = -Math.PI/2 + j*span + gapA/2;
        const a1 = -Math.PI/2 + (j+1)*span - gapA/2;
        const [tx,ty] = pt(midR, (a0+a1)/2);
        out.push({ markup:`<path d="${sectorPath(rInner, rOut, a0, a1)}"/>`, ring:ri, cx:tx, cy:ty, fs:fs });
      }
    });
    return out;
  }

  /* ---------------- 布局：星芒（Voronoi × 五角星） ---------------- */
  // 先在一个单位圆里做 Voronoi（圆是凸的，半平面裁剪才成立），
  // 再按角度把半径映射到五角星边界 —— 连续映射保证格子不会被切断。
  const STAR_POINTS = 5;
  const STAR_INNER  = 0.72;
  const STAR_OUT    = 292;

  const DOMAIN = (function(){
    const p = [];
    for(let i=0;i<96;i++){
      const a = i/96*Math.PI*2;
      p.push({ x: Math.cos(a), y: Math.sin(a) });
    }
    return p;
  })();

  // 单位星形在角度 θ 处的半径：射线与 10 条边求交
  function starRadius(theta){
    const n = STAR_POINTS * 2;
    const ux = Math.cos(theta), uy = Math.sin(theta);
    for(let i=0;i<n;i++){
      const a0 = -Math.PI/2 + i*Math.PI/STAR_POINTS;
      const a1 = -Math.PI/2 + (i+1)*Math.PI/STAR_POINTS;
      const r0 = (i % 2) ? STAR_INNER : 1;
      const r1 = (i % 2) ? 1 : STAR_INNER;
      const x0 = Math.cos(a0)*r0, y0 = Math.sin(a0)*r0;
      const x1 = Math.cos(a1)*r1, y1 = Math.sin(a1)*r1;
      const dx = x1 - x0, dy = y1 - y0;
      const den = ux*dy - uy*dx;
      if(Math.abs(den) < 1e-9) continue;
      const t = (x0*dy - y0*dx) / den;
      const s = (ux*t - x0)*dx + (uy*t - y0)*dy;
      const len2 = dx*dx + dy*dy;
      if(t > 0 && s >= -1e-9 && s <= len2 + 1e-9) return t;
    }
    return 1;
  }

  function warp(p){
    const r = Math.sqrt(p.x*p.x + p.y*p.y);
    if(r < 1e-9) return { x: CX, y: CY };
    const th = Math.atan2(p.y, p.x);
    const R  = starRadius(th) * STAR_OUT;
    return { x: CX + Math.cos(th)*r*R, y: CY + Math.sin(th)*r*R };
  }

  // Sutherland–Hodgman：保留 nx*x + ny*y <= c 的半平面
  function clipHalf(poly, nx, ny, c){
    const out = [];
    for(let i=0;i<poly.length;i++){
      const a = poly[i], b = poly[(i+1)%poly.length];
      const da = nx*a.x + ny*a.y - c;
      const db = nx*b.x + ny*b.y - c;
      if(da <= 1e-9) out.push(a);
      if((da < 0 && db > 0) || (da > 0 && db < 0)){
        const t = da / (da - db);
        out.push({ x: a.x + t*(b.x-a.x), y: a.y + t*(b.y-a.y) });
      }
    }
    return out;
  }

  function voronoiCell(seeds, i){
    let poly = DOMAIN;
    const si = seeds[i];
    for(let j=0;j<seeds.length && poly.length>2;j++){
      if(j === i) continue;
      const sj = seeds[j];
      const nx = sj.x - si.x, ny = sj.y - si.y;
      const c  = (sj.x*sj.x + sj.y*sj.y - si.x*si.x - si.y*si.y) / 2;
      poly = clipHalf(poly, nx, ny, c);
    }
    return poly;
  }

  function polyInfo(poly){
    let a = 0, cx = 0, cy = 0;
    for(let i=0;i<poly.length;i++){
      const p = poly[i], q = poly[(i+1)%poly.length];
      const f = p.x*q.y - q.x*p.y;
      a += f; cx += (p.x+q.x)*f; cy += (p.y+q.y)*f;
    }
    a *= 0.5;
    if(Math.abs(a) < 1e-9) return { area:0, x:poly[0].x, y:poly[0].y };
    return { area: Math.abs(a), x: cx/(6*a), y: cy/(6*a) };
  }

  function pointInPoly(pt, poly){
    let inside = false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const a = poly[i], b = poly[j];
      if(((a.y > pt.y) !== (b.y > pt.y)) &&
         (pt.x < (b.x-a.x)*(pt.y-a.y)/(b.y-a.y) + a.x)) inside = !inside;
    }
    return inside;
  }

  // 重心到最近的边（决定字号，避免长条格里数字溢出）
  function inradius(poly, c){
    let m = Infinity;
    for(let i=0;i<poly.length;i++){
      const a = poly[i], b = poly[(i+1)%poly.length];
      const dx = b.x-a.x, dy = b.y-a.y;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const d = Math.abs((c.x-a.x)*dy - (c.y-a.y)*dx) / len;
      if(d < m) m = d;
    }
    return m === Infinity ? 0 : m;
  }

  function buildStarOnce(n){
    const N = n*n;
    let seeds = [];

    // 最远点采样：疏密均匀，避免极小碎块
    for(let i=0;i<N;i++){
      let best = null, bestD = -1;
      for(let k=0;k<40;k++){
        const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*0.94;
        const p = { x: Math.cos(a)*r, y: Math.sin(a)*r };
        let d = Infinity;
        for(const s of seeds) d = Math.min(d, (s.x-p.x)*(s.x-p.x) + (s.y-p.y)*(s.y-p.y));
        if(d > bestD){ bestD = d; best = p; }
      }
      seeds.push(best);
    }

    // Lloyd 松弛：单位圆内两轮，面积趋同
    for(let it=0; it<2; it++){
      const next = [];
      for(let i=0;i<N;i++){
        const info = polyInfo(voronoiCell(seeds, i));
        next.push(info.area > 1e-9 ? { x: info.x, y: info.y } : seeds[i]);
      }
      seeds = next;
    }

    const gap = 3.4;
    const out = [];
    for(let i=0;i<N;i++){
      const poly = voronoiCell(seeds, i).map(warp);
      if(poly.length < 3) continue;

      let info = polyInfo(poly);
      if(!pointInPoly(info, poly)){          // 极端拉伸时退回顶点均值
        let sx = 0, sy = 0;
        for(const p of poly){ sx += p.x; sy += p.y; }
        info = { area: info.area, x: sx/poly.length, y: sy/poly.length };
      }

      const pts = poly.map(p => {
        const dx = p.x - info.x, dy = p.y - info.y;
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        const k = Math.max(0.4, (len - gap) / len);
        return `${(info.x + dx*k).toFixed(2)},${(info.y + dy*k).toFixed(2)}`;
      });

      const ir = inradius(poly, info);
      out.push({
        markup: `<polygon points="${pts.join(' ')}"/>`,
        cx: info.x, cy: info.y, ir: ir,
        fs: Math.max(13, Math.min(33, ir * 1.02))
      });
    }
    return out;
  }

  // 星形的凹口会把格子压扁；重排几次，取“最小格”最大的一版
  function buildStar(n){
    let best = null;
    for(let attempt=0; attempt<14; attempt++){
      const cells = buildStarOnce(n);
      if(cells.length < n*n) continue;
      let minIR = Infinity;
      for(const c of cells) minIR = Math.min(minIR, c.ir);
      if(!best || minIR > best.minIR) best = { cells, minIR };
      if(minIR >= 16) break;
    }
    return best ? best.cells : buildStarOnce(n);
  }

  /* ---------------- 渲染 ---------------- */
  function build(){
    if(state.shape === 'square') return buildSquare(state.n);
    if(state.shape === 'radial') return buildRadial(state.n);
    return buildStar(state.n);
  }
  function shuffled(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function render(){
    const cells = build();
    const nums  = shuffled(Array.from({length:cells.length}, (_,i)=>i+1));
    const parts = [];
    let open = false, lastRing = null;

    for(let i=0;i<cells.length;i++){
      const c = cells[i];
      const rk = (c.ring === undefined) ? null : c.ring;
      if(rk !== lastRing){
        if(open) parts.push('</g>');
        open = false;
        if(rk !== null){ parts.push(`<g class="ring" data-k="${rk}">`); open = true; }
        lastRing = rk;
      }
      parts.push(
        `<g class="cell">${c.markup}` +
        `<text x="${c.cx.toFixed(2)}" y="${c.cy.toFixed(2)}" data-x="${c.cx.toFixed(2)}" data-y="${c.cy.toFixed(2)}" ` +
        `font-size="${c.fs.toFixed(2)}" text-anchor="middle" dominant-baseline="central" data-i="${i}"></text></g>`
      );
    }
    if(open) parts.push('</g>');

    let html = parts.join('');
    if(state.shape === 'radial'){
      html += `<circle class="halo" cx="300" cy="300" r="279"/>`
            + `<circle class="orbit" cx="300" cy="300" r="288"/>`;
    }

    board.innerHTML = html;
    state.total = cells.length;
    state.numOf = nums;          // 数字先存在内存里，倒计时结束才画到格子上
    collectRings();
  }

  // 只在开局瞬间揭示数字：之前的棋盘是纯色块，没法提前记位置
  function revealNumbers(){
    const cells = board.querySelectorAll('.cell');
    for(let i=0;i<cells.length;i++){
      const g = cells[i];
      const n = state.numOf[i];
      if(n === undefined) continue;
      g.dataset.num = n;
      const t = g.querySelector('text');
      if(t) t.textContent = n;
    }
  }

  /* ---------------- 圆环动效 ---------------- */
  function collectRings(){
    rings = [];
    if(state.shape !== 'radial') return;
    board.querySelectorAll('g.ring').forEach(g => {
      const k = parseInt(g.dataset.k, 10);
      rings.push({
        g: g,
        speed: state.motion ? (ROT_SPEED[k % ROT_SPEED.length] || 0) : 0,
        angle: k === 0 ? 0 : Math.random()*360,
        texts: Array.from(g.querySelectorAll('text')).map(t => ({
          el: t, x: parseFloat(t.dataset.x), y: parseFloat(t.dataset.y)
        }))
      });
    });
    rings.forEach(applyRing);
    if(rings.length){ animT = 0; cancelAnimationFrame(animRAF); animRAF = requestAnimationFrame(animate); }
  }

  function applyRing(r){
    if(!r.speed) return;
    r.g.setAttribute('transform', `rotate(${r.angle.toFixed(2)} 300 300)`);
    const inv = (-r.angle).toFixed(2);
    for(const t of r.texts) t.el.setAttribute('transform', `rotate(${inv} ${t.x} ${t.y})`);
  }

  function animate(ts){
    if(!rings.length){ animT = 0; return; }
    const dt = Math.min(64, animT ? ts - animT : 16);
    animT = ts;
    for(const r of rings){
      if(!r.speed) continue;
      r.angle += r.speed * dt / 1000;
      if(r.angle > 360) r.angle -= 360;
      if(r.angle < -360) r.angle += 360;
      applyRing(r);
    }
    animRAF = requestAnimationFrame(animate);
  }

  function setMotion(on){
    state.motion = on;
    for(const r of rings){
      if(on){
        r.speed = ROT_SPEED[parseInt(r.g.dataset.k, 10) % ROT_SPEED.length] || 0;
      }else{
        r.speed = 0;
        r.angle = 0;
        r.g.removeAttribute('transform');
        for(const t of r.texts) t.el.removeAttribute('transform');
      }
    }
    animT = 0;
    if(on && rings.length){ cancelAnimationFrame(animRAF); animRAF = requestAnimationFrame(animate); }
  }

  /* 元素中心点（含所有变换），用于涟漪定位 */
  function centerOf(g){
    try{
      const bb = g.getBBox();
      const m  = g.getScreenCTM();
      if(!m) return null;
      const p = new DOMPoint(bb.x + bb.width/2, bb.y + bb.height/2).matrixTransform(m);
      const q = new DOMPoint(p.x, p.y).matrixTransform(board.getScreenCTM().inverse());
      return q;
    }catch(e){
      const r = g.getBoundingClientRect(), b = board.getBoundingClientRect();
      if(!b.width) return null;
      return { x:(r.left + r.width/2 - b.left)/b.width*600, y:(r.top + r.height/2 - b.top)/b.height*600 };
    }
  }

  /* ---------------- 排行榜存储 ---------------- */
  const LB_KEY = 'schulte.lb.v3';
  const LB_MAX = 20;                       // 本机保留最近 20 次
  const lbKeyOf = (sh, n, rev) => sh + '|' + n + '|' + (rev ? 'r' : 'f');

  // 一次性清理旧版本遗留键
  (function purgeLegacy(){
    try{
      const dead = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(!k) continue;
        if(k === 'schulte.lb.v1' || k === 'schulte.lb.v2' || k.indexOf('schulte.rec.') === 0) dead.push(k);
      }
      dead.forEach(k => localStorage.removeItem(k));
    }catch(e){}
  })();

  function lbAll(){
    try{ return JSON.parse(localStorage.getItem(LB_KEY)) || {}; }catch(e){ return {}; }
  }
  // 本机：按时间倒序的“我的记录”，不是排名
  function lbList(sh, n, rev){ return lbAll()[lbKeyOf(sh, n, rev)] || []; }

  function lbBest(){
    let best = null;
    for(const r of lbList(state.shape, state.n, state.reverse)) if(!best || r.t < best.t) best = r;
    return best;
  }
  function lbAdd(run){
    const all = lbAll();
    const k = lbKeyOf(state.shape, state.n, state.reverse);
    all[k] = [run].concat(all[k] || []).slice(0, LB_MAX);
    try{ localStorage.setItem(LB_KEY, JSON.stringify(all)); }catch(e){}
  }
  const fmt = t => t.toFixed(2);
  const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function refreshBestLine(){
    const r = lbBest();
    elBest.textContent = r ? `最佳 ${fmt(r.t)} 秒 · ${r.s} 分` : '最佳 —';
  }

  /* ---------------- 在线榜接口 ---------------- */
  const apiBase = () => NET.base || '';

  async function netPost(rec){
    const res = await fetch(apiBase() + '/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: rec.id,
        mode: rec.mode, size: rec.size, rev: rec.rev, t: rec.t, s: rec.s
      })
    });
    let j = {};
    try{ j = await res.json(); }catch(e){}
    if(!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    return j;
  }

  async function netRegister(name){
    const res = await fetch(apiBase() + '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    let j = {};
    try{ j = await res.json(); }catch(e){}
    if(!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    return j;
  }

  async function netLogin(id){
    const res = await fetch(apiBase() + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    let j = {};
    try{ j = await res.json(); }catch(e){}
    if(!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    return j;
  }

  async function netRename(id, name){
    const res = await fetch(apiBase() + '/api/player', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, name })
    });
    let j = {};
    try{ j = await res.json(); }catch(e){}
    if(!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    return j;
  }

  async function netTop(mode, size, rev, limit){
    const q = new URLSearchParams({ mode, size: String(size), rev: rev ? '1' : '0', limit: String(limit || 20) });
    const res = await fetch(apiBase() + '/api/scores?' + q);
    let j = {};
    try{ j = await res.json(); }catch(e){}
    if(!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    return j.items || [];
  }

  function resetHud(){
    elTime.textContent = '0.00';
    elScore.textContent = '—';
    elScore.className = '';
    elErr.textContent = '0';
    elBar.style.width = '0%';
    elTarget.textContent = state.queue.length ? state.queue[0] : '1';
  }

  function shapeNameOf(s){
    return s === 'square' ? '方形' : s === 'radial' ? '圆环' : '星芒';
  }
  function shapeName(){ return shapeNameOf(state.shape); }

  /* ---------------- 开局 ---------------- */
  function newRound(){
    state.token++;
    cancelAnimationFrame(state.raf);
    state.started = false;
    state.finished = false;
    state.qi = 0;
    state.errors = 0;
    state.penalty = 0;

    render();
    board.classList.remove('fin');

    const N = state.total;
    state.queue = Array.from({length:N}, (_,i)=> state.reverse ? N - i : i + 1);
    resetHud();
    refreshBestLine();

    const rec = lbBest();
    overlay.hidden = false;
    overlay.classList.add('show');
    overlay.innerHTML =
      `<div class="panel-in">
         <h2>${shapeName()} · ${state.n}×${state.n}${state.reverse?' · 倒序':''}</h2>
         <div class="big">${rec ? fmt(rec.t) + '<small>s</small><em>最佳</em>' : N + '<small>格</small>'}</div>
         <div class="meta">目标顺序 <b>${state.queue[0]} → ${state.queue[N-1]}</b><br>
           ${rec ? `最佳评分 <b>${rec.s}</b> 分 · ` : ''}点错 +1 秒罚时</div>
         <button class="btn" id="startBtn">开始游戏</button>
         <div class="tiny">S 基准 ${parOf().toFixed(1)}s · ${gradeLines()}</div>
       </div>`;
    $('#startBtn').addEventListener('click', beginRound);
  }

  function beginRound(){
    state.token++;
    const tok = state.token;
    state.qi = 0;
    state.errors = 0;
    state.penalty = 0;
    state.finished = false;
    elErr.textContent = '0';
    elTime.textContent = '0.00';
    elScore.textContent = '—';
    elScore.className = '';
    elBar.style.width = '0%';
    elTarget.textContent = state.queue[0];

    const seq = ['3','2','1','GO'];
    let i = 0;
    overlay.hidden = false;
    overlay.classList.add('show');

    const step = () => {
      if(tok !== state.token) return;
      if(i >= seq.length){
        overlay.classList.remove('show');
        overlay.hidden = true;
        overlay.innerHTML = '';
        revealNumbers();                 // 数字与计时同时出现，杜绝提前记忆
        state.started = true;
        state.t0 = performance.now();
        state.raf = requestAnimationFrame(tick);
        return;
      }
      const label = seq[i++];
      overlay.innerHTML = `<div class="cd">${label}</div>`;
      blip(label === 'GO' ? 940 : 500, label === 'GO' ? 0.12 : 0.07, 'sine');
      setTimeout(step, label === 'GO' ? 260 : 400);
    };
    step();
  }

  function tick(){
    if(!state.started) return;
    const t = (performance.now() - state.t0)/1000 + state.penalty;
    elTime.textContent = fmt(t);
    if(t > 0.8){
      const s = scoreOf(t);
      elScore.textContent = s;
      elScore.className = 'g-' + gradeOf(s);
    }
    state.raf = requestAnimationFrame(tick);
  }

  /* ---------------- 交互 ---------------- */
  board.addEventListener('pointerdown', function(e){
    const g = e.target.closest ? e.target.closest('.cell') : null;
    if(!g || !state.started || state.finished) return;
    if(g.classList.contains('done')) return;
    const num = parseInt(g.dataset.num, 10);
    if(num === state.queue[state.qi]) hit(g);
    else miss(g);
  });

  function hit(g){
    ripple(g);
    g.classList.add('done');
    blip(540 + state.qi*11, 0.05, 'triangle');
    state.qi++;
    if(state.qi >= state.queue.length){ finish(); return; }
    elTarget.textContent = state.queue[state.qi];
    elBar.style.width = (state.qi / state.queue.length * 100).toFixed(1) + '%';
  }

  function miss(g){
    state.errors++;
    state.penalty += 1;
    elErr.textContent = state.errors;
    g.classList.add('wrong');
    setTimeout(()=>g.classList.remove('wrong'), 260);
    blip(150, 0.13, 'square');
  }

  function ripple(g){
    const c = centerOf(g);
    if(!c) return;
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    el.setAttribute('class', 'rip');
    el.setAttribute('cx', c.x); el.setAttribute('cy', c.y); el.setAttribute('r', 16);
    el.style.transformOrigin = c.x + 'px ' + c.y + 'px';
    board.appendChild(el);
    setTimeout(()=>el.remove(), 620);
  }

  function finish(){
    cancelAnimationFrame(state.raf);
    state.started = false;
    state.finished = true;
    elTarget.textContent = '✓';
    board.classList.add('fin');
    elBar.style.width = '100%';

    const time  = (performance.now() - state.t0)/1000 + state.penalty;
    const score = scoreOf(time);
    const grade = gradeOf(score);
    const prev  = lbBest();                        // 本机个人最好
    const run = {
      id:   profile ? profile.id : '',
      name: profile ? profile.name : '',
      t: parseFloat(time.toFixed(2)),
      s: score,
      d: new Date().toISOString(),
      mode: state.shape, size: state.n, rev: state.reverse
    };
    state.lastRun = run;
    const improved = !prev || run.t < prev.t;

    lbAdd(run);

    elTime.textContent = fmt(time);
    elScore.textContent = score;
    elScore.className = 'g-' + grade;

    const avg = time / state.queue.length;
    const deltaTxt = prev
      ? (improved ? `比个人最好快 <b>${fmt(prev.t - run.t)}</b>s` : `比个人最好慢 <b>${fmt(run.t - prev.t)}</b>s`)
      : '首局记录';

    fanfare(grade);

    const who = profile
      ? `${esc(profile.name)}${profile.id ? `<em style="color:#5d6a88;font-style:normal;font-size:11px">${tagOf(profile.id)}</em>` : ''}`
      : '';

    overlay.hidden = false;
    overlay.classList.add('show');
    overlay.innerHTML =
      `<div class="panel-in">
         <h2>完成 · ${shapeName()} ${state.n}×${state.n}${state.reverse?' 倒序':''}</h2>
         <div class="scoreRow">
           <div class="badge g-${grade}">${grade}</div>
           <div class="big">${fmt(time)}<small>秒</small></div>
         </div>
         <div class="meta">评分 <b class="g-${grade}">${score}</b> 分 · 失误 <b>${state.errors}</b> 次 · 均速 <b>${avg.toFixed(2)}</b>s/格</div>
         <div class="meta">${improved ? '<span class="rec">★ 个人最好</span>' : deltaTxt}</div>
         ${who ? `<div class="meta" style="font-size:12px">${who}</div>` : ''}
         <div class="tiny" id="postMsg" style="min-height:15px"></div>
         <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
           <button class="btn" id="againBtn">再来一局</button>
           <button class="btn ghost" id="lbBtn">看排行榜</button>
         </div>
         <div class="tiny">S 基准 ${parOf().toFixed(1)}s · ${gradeLines()}</div>
       </div>`;

    const msg = $('#postMsg');
    if(!online){
      msg.textContent = improved ? '本机最好成绩已刷新' : `未破个人最好 ${fmt(prev.t)} 秒`;
    }else if(profile && profile.id){
      pushRun(run);                                // 有档案就自动上榜，不需要点按钮
    }else{
      msg.style.color = 'var(--dim)';
      msg.textContent = '离线档案：连上服务器后可自动上榜';
    }

    $('#againBtn').addEventListener('click', newRound);
    $('#lbBtn').addEventListener('click', function(){ openLB(); });

    refreshBestLine();
  }

  /* ---------------- 排行榜界面 ---------------- */
  const lbModal = $('#lb');
  const lbView  = { shape:'square', n:5, rev:false, scope:'local' };

  function lbSync(){
    document.querySelectorAll('#lbShapeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === lbView.shape));
    document.querySelectorAll('#lbSizeSeg button').forEach(b => b.classList.toggle('on', parseInt(b.dataset.v,10) === lbView.n));
    document.querySelectorAll('#lbScope button').forEach(b => b.classList.toggle('on', b.dataset.v === lbView.scope));
    $('#lbRev').classList.toggle('on', lbView.rev);
    $('#lbScope').hidden = !online;
    $('#lbFootNote').textContent = lbView.scope === 'global'
      ? '全球榜 · 取用时最快的前 20 名'
      : '我的记录 · 最近 20 次';
    $('#lbClear').style.display = lbView.scope === 'global' ? 'none' : '';
    $('#lbSubtitle').textContent = `${shapeNameOf(lbView.shape)} ${lbView.n}×${lbView.n} · ${lbView.rev?'倒序':'正序'}`;
  }

  function shortDate(iso){
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    const p = x => String(x).padStart(2,'0');
    return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function renderLB(){
    const box = $('#lbList');

    if(lbView.scope === 'global' && online){
      box.innerHTML = `<div class="lb-empty">加载中…</div>`;
      netTop(lbView.shape, lbView.n, lbView.rev, 20).then(rows => {
        if(!rows.length){
          box.innerHTML = `<div class="lb-empty">全球榜还没有成绩<br>你可以做第一个</div>`;
          return;
        }
        box.innerHTML = rows.map((r, i) => {
          const me = profile && r.id === profile.id;
          return `<div class="lb-row g${me ? ' me' : ''}">
            <span class="rk rk${i+1}">${i+1}</span>
            <span class="nm"><b>${esc(r.name || '匿名')}</b><em>${tagOf(r.id)}</em>${me ? ' <small style="color:var(--acc2);font-weight:600">我</small>' : ''}</span>
            <span class="t">${fmt(r.t)}<small>秒</small></span>
            <span class="s g-${gradeOf(r.s)}">${r.s}</span>
          </div>`;
        }).join('');
      }).catch(e => {
        box.innerHTML = `<div class="lb-empty">加载失败：${esc(e.message)}<br>
          <span style="font-size:11px">检查后端地址是否可达</span></div>`;
      });
      return;
    }

    const arr = lbList(lbView.shape, lbView.n, lbView.rev);
    if(!arr.length){
      box.innerHTML = `<div class="lb-empty">还没有记录<br>先跑一局</div>`;
      return;
    }
    let bestT = Infinity;
    for(const r of arr) if(r.t < bestT) bestT = r.t;

    box.innerHTML = arr.map(r => `
      <div class="lb-row">
        <span class="rk">${r.t === bestT ? '★' : ''}</span>
        <span class="t">${fmt(r.t)}<small>秒</small></span>
        <span class="s g-${gradeOf(r.s)}">${r.s}</span>
        <span class="d">${shortDate(r.d)}</span>
      </div>`).join('');
  }

  async function pushRun(rec){
    if(!online || !rec) return;
    const msg = $('#postMsg');
    // 昵称由服务端根据 id 查表，前端不用传
    try{
      const r = await netPost(rec);
      if(msg){
        msg.style.color = 'var(--acc2)';
        msg.innerHTML = r.improved
          ? `已自动上榜 · 全球第 <b>${r.rank}</b> 名`
          : `未破个人最好 <b>${fmt(r.best)}</b> 秒，榜单保持不变`;
      }
    }catch(e){
      if(msg){
        msg.style.color = 'var(--bad)';
        msg.textContent = e.message === 'invalid score'
          ? '成绩未通过服务端校验（用时过短或数值异常），未上榜'
          : '上榜失败：' + e.message;
      }
    }
  }

  /* ---------------- 开局建档 / 登录 ---------------- */
  const gateEl = $('#gate');
  let gateMode = 'name';

  function gateSetMode(mode){
    gateMode = mode;
    const isName = mode === 'name';
    $('#gateSub').textContent = isName ? '起个名字就能上榜，不用注册' : '输入你的 9 位档案号';
    $('#gateName').hidden = !isName;
    $('#gateId').hidden = isName;
    $('#gateGo').textContent = isName ? '开始' : '登录';
    $('#gateSwitch').textContent = isName ? '已有档案？用档案号登录' : '没有档案？返回起名字';
    $('#gateMsg').textContent = '';
    (isName ? $('#gateName') : $('#gateId')).focus();
  }

  function openGate(){
    gateEl.classList.add('show');
    gateSetMode('name');
    setTimeout(() => $('#gateName').focus(), 200);
  }
  function closeGate(){ gateEl.classList.remove('show'); }

  function gateMsg(text, ok){
    const el = $('#gateMsg');
    el.textContent = text || '';
    el.style.color = ok ? 'var(--acc2)' : 'var(--bad)';
  }

  $('#gateSwitch').addEventListener('click', function(){
    gateSetMode(gateMode === 'name' ? 'id' : 'name');
  });

  $('#gateId').addEventListener('input', function(){
    this.value = this.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 9);
  });

  $('#gateName').addEventListener('keydown', e => { if(e.key === 'Enter') $('#gateGo').click(); });
  $('#gateId').addEventListener('keydown', e => { if(e.key === 'Enter') $('#gateGo').click(); });

  $('#gateGo').addEventListener('click', async function(){
    const btn = this;
    if(gateMode === 'id'){
      const id = $('#gateId').value.trim().toUpperCase();
      if(!/^[0-9]{3}[A-Z0-9]{6}$/.test(id)) return gateMsg('档案号是 9 位：前 3 位数字 + 后 6 位字母数字');
      if(!online) return gateMsg('没连上服务器，稍后再试');
      btn.disabled = true; btn.textContent = '登录中…';
      try{
        const p2 = await netLogin(id);
        saveProfile({ id: p2.id, name: p2.name });
        closeGate(); newRound();
      }catch(e){
        gateMsg(e.message === 'not found' ? '没有这个档案号' : ('登录失败：' + e.message));
      }
      btn.disabled = false; btn.textContent = '登录';
      return;
    }

    const name = $('#gateName').value.trim().slice(0, 12);
    if(!name) return gateMsg('起个名字吧');

    if(!online){                                   // 离线：只建一个本机档案
      saveProfile({ id:'', name });
      closeGate(); newRound();
      return;
    }

    btn.disabled = true; btn.textContent = '创建中…';
    try{
      const p2 = await netRegister(name);
      saveProfile({ id: p2.id, name: p2.name });
      closeGate(); newRound();
    }catch(e){
      gateMsg('创建失败：' + e.message);
    }
    btn.disabled = false; btn.textContent = '开始';
  });

  /* ---------------- 我的档案 ---------------- */
  const meEl = $('#me');

  function openMe(){
    if(!profile) return;
    $('#meName').textContent = profile.name;
    $('#meTag').textContent = profile.id ? tagOf(profile.id) : '（本机）';
    $('#meId').textContent = profile.id || '—— 离线 ——';
    $('#meRenameBox').hidden = true;
    const link = profile.id ? syncLink(profile.id) : '';
    $('#meLink').textContent = link || '离线档案没有同步链接，连上服务器并重新建档后才有';
    $('#meWarn').hidden = !profile.id;
    $('#meHelp').hidden = !profile.id;
    $('#meNote').textContent = profile.id
      ? '把下面的链接发到手机（或直接在手机上打开），就能接管这份档案。谁拿到链接谁就能用你的档案。'
      : '当前是离线档案，成绩只存在这台设备上。';
    meEl.classList.add('show');
  }
  function closeMe(){ meEl.classList.remove('show'); }

  $('#chip').addEventListener('click', openMe);
  $('#meClose').addEventListener('click', closeMe);
  meEl.addEventListener('click', e => { if(e.target === meEl) closeMe(); });

  $('#meMail').addEventListener('click', function(){
    const btn = this;
    copyText('fishquito7@163.com').then(ok => {
      btn.textContent = ok ? '已复制' : '请长按选中';
      btn.classList.toggle('copied', ok);
      setTimeout(() => {
        btn.textContent = 'fishquito7@163.com';
        btn.classList.remove('copied');
      }, 1400);
    });
  });

  $('#meCopyId').addEventListener('click', function(){
    if(!profile || !profile.id) return;
    const btn = this;
    copyText(profile.id).then(() => {
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = '复制'; }, 1200);
    });
  });

  $('#meCopyLink').addEventListener('click', function(){
    if(!profile || !profile.id) return;
    const btn = this;
    copyText(syncLink(profile.id)).then(() => {
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = '复制同步链接'; }, 1200);
    });
  });

  $('#meRename').addEventListener('click', function(){
    $('#meRenameBox').hidden = false;
    $('#meRenameInput').value = profile ? profile.name : '';
    $('#meRenameInput').focus();
  });

  $('#meRenameOk').addEventListener('click', async function(){
    const name = $('#meRenameInput').value.trim().slice(0, 12);
    if(!name || !profile) return;
    if(profile.id && online){
      try{ await netRename(profile.id, name); }
      catch(e){ this.textContent = '失败'; setTimeout(()=>{ this.textContent = '保存'; }, 1200); return; }
    }
    saveProfile({ id: profile.id, name });
    $('#meName').textContent = name;
    $('#meRenameBox').hidden = true;
    renderLB();
  });

  $('#meOut').addEventListener('click', function(){
    clearProfile();
    closeMe();
    openGate();
  });

  function openLB(){
    lbView.shape = state.shape;
    lbView.n     = state.n;
    lbView.rev   = state.reverse;
    lbSync();
    renderLB();
    lbModal.classList.add('show');
  }
  function closeLB(){ lbModal.classList.remove('show'); }

  /* ---------------- 配置 ---------------- */
  function bindSeg(sel, key, cast){
    const box = $(sel);
    box.addEventListener('click', function(e){
      const b = e.target.closest('button');
      if(!b || b.classList.contains('on')) return;
      Array.from(box.children).forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      state[key] = cast(b.dataset.v);
      newRound();
    });
  }
  bindSeg('#shapeSeg', 'shape', v=>v);
  bindSeg('#sizeSeg', 'n', v=>parseInt(v,10));

  $('#motion').addEventListener('click', function(){
    const on = !this.classList.contains('on');
    this.classList.toggle('on', on);
    setMotion(on);
  });

  $('#rev').addEventListener('click', function(){
    state.reverse = !state.reverse;
    this.classList.toggle('on', state.reverse);
    newRound();
  });

  $('#again2').addEventListener('click', newRound);

  $('#sound').addEventListener('click', function(){
    state.sound = !state.sound;
    this.textContent = state.sound ? '🔊' : '🔇';
    if(state.sound) blip(660, 0.06);
  });

  /* ---------- 排行榜事件 ---------- */
  $('#openLB').addEventListener('click', openLB);
  $('#lbClose').addEventListener('click', closeLB);
  lbModal.addEventListener('click', function(e){ if(e.target === lbModal) closeLB(); });

  $('#lbShapeSeg').addEventListener('click', function(e){
    const b = e.target.closest('button');
    if(!b) return;
    lbView.shape = b.dataset.v; lbSync(); renderLB();
  });
  $('#lbSizeSeg').addEventListener('click', function(e){
    const b = e.target.closest('button');
    if(!b) return;
    lbView.n = parseInt(b.dataset.v, 10); lbSync(); renderLB();
  });
  $('#lbRev').addEventListener('click', function(){
    lbView.rev = !lbView.rev; lbSync(); renderLB();
  });
  $('#lbScope').addEventListener('click', function(e){
    const b = e.target.closest('button');
    if(!b) return;
    lbView.scope = b.dataset.v; lbSync(); renderLB();
  });
  $('#lbClear').addEventListener('click', function(){
    const all = lbAll();
    delete all[lbKeyOf(lbView.shape, lbView.n, lbView.rev)];
    try{ localStorage.setItem(LB_KEY, JSON.stringify(all)); }catch(e){}
    renderLB(); refreshBestLine();
    blip(300, .08, 'square');
  });

  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closeLB(); return; }
    const lbOpen = lbModal.classList.contains('show');
    if(!lbOpen && (e.code === 'Space' || e.code === 'Enter')){
      e.preventDefault();
      const b = overlay.querySelector('button');
      if(b) b.click();
    }
    if(!lbOpen && (e.key === 'r' || e.key === 'R')) newRound();
  });

  /* ---------------- 启动 ---------------- */
  async function boot(){
    await netReady;

    // 带档案号的链接：自动接管这份档案，然后把地址栏里的 id 抹掉
    const m = location.search.match(/[?&]id=([0-9A-Za-z]{9})/);
    if(m && online){
      try{
        const p2 = await netLogin(m[1].toUpperCase());
        saveProfile({ id: p2.id, name: p2.name });
        history.replaceState(null, '', location.pathname + location.hash);
        newRound();
        return;
      }catch(e){
        newRound();
        openGate();
        gateMsg(e.message === 'not found' ? '链接里的档案号不存在' : ('登录失败：' + e.message));
        return;
      }
    }

    renderChip();
    newRound();
    if(!profile) openGate();
  }

  boot();
})();
</script>
</body>
</html>
